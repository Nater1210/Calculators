<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Calculators</title>
  <style>
    :root{--ink:#111827;--muted:#6b7280;--border:#e5e7eb;--bg:#f8fafc;--card:#ffffff;--primary:#2563eb}
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--ink)
    }
    .wrap{max-width:900px;margin:0 auto;padding:24px}
    h1{margin:0 0 6px 0}
    p{margin:0 0 18px 0;color:var(--muted);line-height:1.4}
    .card{
      background:#fff;
      border:1px solid var(--border);
      border-radius:16px;
      padding:16px
    }
    .links a{
      display:block;
      padding:12px 12px;
      border:1px solid var(--border);
      border-radius:12px;
      background:#fff;
      color:var(--primary);
      text-decoration:none;
      font-weight:600;
    }
    .links a:hover{background:#f1f5f9}
    .hint{margin-top:10px;color:var(--muted);font-size:12px}
    .mono{
      font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>My Calculators</h1>
    <p>Simple hub page. Click the calculator link below.</p>

    <div class="card">
      <div class="links">
        <a href="tools/calorie.html">Calorie + Macro Calculator</a>
      </div>

      <div class="hint">
        This link expects your calculator file to be at:
        <span class="mono">/tools/calorie.html</span>
      </div>
    </div>
  </div>
</body>
</html>
